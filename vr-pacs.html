<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR PACS - Quản lý Ảnh Siêu âm - Phòng khám Đại Anh</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="ai-assistant.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding-bottom: 30px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5rem 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header h1 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .search-bar {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-input {
            flex: 1;
            min-width: 250px;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .filter-group select {
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .refresh-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

        .stat-card .number {
            font-size: 2rem;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-card .label {
            color: #6c757d;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .patients-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }

        .patient-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .patient-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }

        .patient-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
        }

        .patient-name {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .patient-info {
            font-size: 0.85rem;
            opacity: 0.9;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .patient-body {
            padding: 20px;
        }

        .images-preview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
            min-height: 100px;
        }

        .image-thumb {
            position: relative;
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            background: #f8f9fa;
            border: 2px solid #e1e5e9;
            transition: all 0.3s ease;
        }

        .image-thumb:hover {
            border-color: #667eea;
            transform: scale(1.05);
        }

        .image-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-thumb .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            color: white;
            font-size: 0.8rem;
            text-align: center;
            padding: 5px;
        }

        .autofill-badge {
            position: absolute;
            top: 6px;
            left: 6px;
            z-index: 3;
            background: rgba(0, 0, 0, 0.65);
            color: #fff;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 3px 7px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .autofill-badge.clickable {
            cursor: pointer;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.15) inset;
        }

        .autofill-badge.status-autofilled {
            background: rgba(32, 136, 61, 0.9);
        }

        .autofill-badge.status-failed {
            background: rgba(170, 32, 32, 0.9);
        }

        .autofill-badge.status-received,
        .autofill-badge.status-not_found {
            background: rgba(80, 80, 80, 0.85);
        }

        .orthanc-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            z-index: 3;
            color: #fff;
            font-size: 0.68rem;
            font-weight: 600;
            padding: 3px 7px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(80, 80, 80, 0.85);
        }

        .orthanc-badge.linked {
            background: rgba(8, 126, 164, 0.9);
        }

        .orthanc-badge.unlinked {
            background: rgba(94, 94, 94, 0.85);
        }

        .image-thumb:hover .overlay {
            opacity: 1;
        }

        .patient-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-small {
            flex: 1;
            padding: 10px;
            font-size: 0.9rem;
            text-align: center;
        }

        .btn-view-all {
            background: #667eea;
            color: white;
        }

        .btn-view-all:hover {
            background: #5568d3;
        }

        .no-images {
            text-align: center;
            padding: 40px 20px;
            color: #6c757d;
        }

        .no-images i {
            font-size: 3rem;
            margin-bottom: 15px;
            display: block;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2rem;
        }

        .loading i {
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            overflow: auto;
        }

        .modal-content {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            background: #111827;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-close {
            color: white;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.3s ease;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .modal-body {
            flex: 1;
            overflow: auto;
            background: black;
        }

        /* DICOM Viewer Styles */
        #dicomViewport {
            width: 100%;
            height: 100%;
            min-height: 600px;
            position: relative;
            cursor: crosshair;
        }
        
        #dicomViewport canvas {
            display: block;
            cursor: inherit;
            pointer-events: auto;
        }

        .viewer-toolbar {
            background: #1f2937;
            padding: 10px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .viewer-measure-actions {
            padding: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.25);
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .measure-import-btn {
            background: #16a34a;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 9px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: transform 0.1s ease, background 0.2s ease;
        }

        .measure-import-btn:hover {
            background: #15803d;
            transform: translateY(-1px);
        }

        .orthanc-open-btn {
            background: #0f766e;
        }

        .orthanc-open-btn:hover {
            background: #115e59;
        }

        .measure-import-note {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.85rem;
            line-height: 1.35;
            max-width: 520px;
            text-align: center;
        }

        .toolbar-btn {
            background: #374151;
            color: #e5e7eb;
            border: 1px solid #4b5563;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .toolbar-btn:hover {
            background: #4b5563;
            transform: translateY(-1px);
        }

        .toolbar-btn.active {
            background: #2563eb;
            border-color: #2563eb;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.4);
        }
        
        .toolbar-btn i {
            font-size: 0.85rem;
        }

        @media (max-width: 768px) {
            .patients-grid {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                gap: 15px;
            }

            .search-bar {
                flex-direction: column;
            }

            .search-input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>
            <i class="fas fa-x-ray"></i>
            VR PACS - Quản lý Ảnh Siêu âm
        </h1>
        <div class="header-actions">
            <a href="/" class="btn">
                <i class="fas fa-home"></i> Trang chủ
            </a>
            <button class="btn btn-primary" onclick="refreshData()">
                <i class="fas fa-sync-alt"></i> Làm mới
            </button>
        </div>
    </div>

    <div class="container">
        <div class="search-bar">
            <input type="text" 
                   id="searchInput" 
                   class="search-input" 
                   placeholder="Tìm kiếm theo tên bệnh nhân..."
                   onkeyup="filterPatients()">
            <div class="filter-group">
                <select id="sortSelect" onchange="filterPatients()">
                    <option value="name">Sắp xếp theo tên</option>
                    <option value="date">Sắp xếp theo ngày</option>
                    <option value="count">Sắp xếp theo số lượng ảnh</option>
                </select>
            </div>
        </div>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="number" id="totalPatients">0</div>
                <div class="label">Bệnh nhân</div>
            </div>
            <div class="stat-card">
                <div class="number" id="totalImages">0</div>
                <div class="label">Ảnh siêu âm</div>
            </div>
            <div class="stat-card">
                <div class="number" id="totalStudies">0</div>
                <div class="label">Nghiên cứu</div>
            </div>
        </div>

        <div id="loadingIndicator" class="loading" style="display: none;">
            <i class="fas fa-spinner"></i> Đang tải dữ liệu...
        </div>

        <div class="patients-grid" id="patientsGrid"></div>
    </div>

    <!-- DICOM Viewer Modal -->
    <div id="viewerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <span id="modalPatientName"></span>
                    <span> | </span>
                    <span id="modalFileName"></span>
                </div>
                <button class="modal-close" onclick="closeViewer()">&times;</button>
            </div>
            <div class="viewer-toolbar"></div>
            <div class="viewer-measure-actions">
                <button type="button" class="measure-import-btn" onclick="importAnnotationsToUltrasoundAnalysisAuto()">
                    <i class="fas fa-magic"></i> Gửi sang phân tích (tự động)
                </button>
                <button type="button" class="measure-import-btn orthanc-open-btn" id="openOrthancBtn" style="display:none;">
                    <i class="fas fa-external-link-alt"></i> Mở trên Orthanc
                </button>
                <div class="measure-import-note">
                    Gợi ý: dùng <b>Đo độ dài</b> cho BPD/FL, <b>ROI Ellipse</b> cho HC và <b>ROI Hình chữ nhật</b> cho AC.
                </div>
            </div>
            <div class="modal-body">
                <div id="dicomViewport"></div>
            </div>
        </div>
    </div>

    <!-- Cornerstone Libraries - Load local copies to avoid CORB -->
    <script>
        // Load libraries strictly from local /static/vendor to avoid CORB / firewall issues
            // Flask static_url_path đang là '/.' do app.py set static_folder='.'
            // (xem: app.app.static_url_path). Vì vậy /static/... sẽ 404.
            const VENDOR_BASE = '/./vr-pacs-viewer/static/vendor';
        const libraryList = [
            {
                name: 'hammerjs',
                urls: [
                    // cornerstone-tools (v4+) sử dụng Hammer để nhận pointer events.
                    // Nếu không load Hammer hoặc không gán cornerstoneTools.external.Hammer
                    // sẽ lỗi kiểu: Cannot read properties of undefined (reading 'SUPPORT_POINTER_EVENTS')
                    'https://unpkg.com/hammerjs@2.0.8/hammer.min.js'
                ]
            },
            {
                name: 'cornerstone-core',
                urls: [
                    `${VENDOR_BASE}/cornerstone.js`,
                    'https://unpkg.com/cornerstone-core@2.6.1/dist/cornerstone.js'
                ]
            },
            {
                name: 'dicom-parser',
                urls: [
                    `${VENDOR_BASE}/dicomParser.js`,
                    'https://unpkg.com/dicom-parser@1.8.21/dist/dicomParser.js'
                ]
            },
            {
                name: 'cornerstone-wado-image-loader',
                urls: [
                    `${VENDOR_BASE}/cornerstoneWADOImageLoader.js`,
                    'https://unpkg.com/cornerstone-wado-image-loader@4.13.2/dist/cornerstoneWADOImageLoader.js'
                ]
            },
            {
                name: 'cornerstone-math',
                urls: [
                    `${VENDOR_BASE}/cornerstoneMath.js`,
                    'https://unpkg.com/cornerstone-math@0.1.10/dist/cornerstoneMath.js'
                ]
            },
            {
                name: 'cornerstone-tools',
                urls: [
                    `${VENDOR_BASE}/cornerstoneTools.js`,
                    'https://unpkg.com/cornerstone-tools@4.22.1/dist/cornerstoneTools.js'
                ]
            }
        ];

        function loadScriptUrl(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.async = false;
                script.onload = () => {
                    console.log(`Loaded script: ${src}`);
                    resolve(src);
                };
                script.onerror = () => {
                    console.warn(`Failed to load script: ${src}`);
                    script.remove();
                    reject(new Error('Failed to load ' + src));
                };
                document.head.appendChild(script);
            });
        }

        async function tryLoadLibrary(lib) {
            for (const url of lib.urls) {
                try {
                    await loadScriptUrl(url);
                    return { name: lib.name, url };
                } catch (e) {
                    // try next
                }
            }
            throw new Error('All sources failed for ' + lib.name);
        }

        async function loadAllLibraries() {
            console.log('Attempting to load DICOM viewer libraries (CDN primary, fallback)...');
            const results = [];
            const failed = [];

            // Load in parallel to reduce initial page wait time.
            await Promise.all(libraryList.map(async (lib) => {
                try {
                    const res = await tryLoadLibrary(lib);
                    results.push(res);
                } catch (err) {
                    console.error(err.message);
                    failed.push(lib.name);
                }
            }));

            if (failed.length > 0) {
                console.error('Libraries failed to load:', failed);
                // Inform user with which libraries are missing
                alert('Các thư viện DICOM viewer chưa được tải: ' + failed.join(', ') + '\nVui lòng kiểm tra kết nối mạng hoặc cài đặt các file vendor vào /static/vendor và tải lại trang.');
            } else {
                console.log('All libraries loaded (or fallback used)');
                if (window.onLibrariesReady) window.onLibrariesReady();
            }
        }

        window.addEventListener('DOMContentLoaded', function() {
            loadAllLibraries();
        });
    </script>

    <script>
        let patientsData = [];
        let filteredPatients = [];
        let currentImageId = null;
        let currentOrthancStudyUrl = '';
        let viewerElement = null;
        let isViewerInitialized = false;
        let isWadoWorkerInitialized = false;
        let TOOL_DEFINITIONS = [];
        let AUTO_IMPORT_DONE_FOR_IMAGE_ID = null;
        let AUTO_IMPORT_DEBOUNCE_TIMER = null;
        // Build toolbar only once; rebuilding on every open causes noticeable lag.
        let isToolbarBuilt = false;

        const lengthConfigFactory = () => ({
            getTextCallback: function(data) {
                if (data && data.handles && data.handles.start && data.handles.end) {
                    try {
                        const distance = cornerstoneMath.point.distance(data.handles.start, data.handles.end);
                        if (data.image && data.image.rowPixelSpacing && data.image.columnPixelSpacing) {
                            const pixelSpacing = (data.image.rowPixelSpacing + data.image.columnPixelSpacing) / 2;
                            const distanceMm = distance * pixelSpacing;
                            return `${distanceMm.toFixed(2)} mm`;
                        }
                        return `${distance.toFixed(2)} px`;
                    } catch (e) {
                        console.error('Error calculating distance:', e);
                        return '';
                    }
                }
                return '';
            }
        });

        const TOOL_METADATA = [
            { key: 'Window', internalKey: 'Wwwc', label: 'Window/Level', icon: 'fas fa-sliders-h', tooltip: 'Window/Level - Điều chỉnh độ sáng/tương phản (Phím W)', className: 'WwwcTool' },
            { key: 'Pan', internalKey: 'Pan', label: 'Pan', icon: 'fas fa-hand-paper', tooltip: 'Pan - Di chuyển ảnh (Phím P)', className: 'PanTool' },
            { key: 'Zoom', internalKey: 'Zoom', label: 'Zoom', icon: 'fas fa-search-plus', tooltip: 'Zoom - Phóng to/thu nhỏ (Phím Z)', className: 'ZoomTool', config: { invert: false } },
            {
                key: 'Length',
                internalKey: 'Length',
                label: 'Đo độ dài',
                icon: 'fas fa-ruler',
                tooltip: 'Đo độ dài - Đo khoảng cách giữa 2 điểm',
                className: 'LengthTool',
                configFactory: lengthConfigFactory
            },
            {
                key: 'Distance',
                internalKey: 'DistanceLength',
                label: 'Distance length',
                icon: 'fas fa-ruler-horizontal',
                tooltip: 'Distance length - Đo khoảng cách giữa hai điểm',
                className: 'LengthTool',
                configFactory: lengthConfigFactory
            },
            {
                key: 'Angle',
                internalKey: 'Angle',
                label: 'Đo góc',
                icon: 'fas fa-angle-left',
                tooltip: 'Đo góc - Đo góc giữa 2 đoạn thẳng',
                className: 'AngleTool',
                configFactory: () => ({
                    getTextCallback: function(data) {
                        if (data.handles && data.handles.start && data.handles.middle && data.handles.end) {
                            const angle = cornerstoneMath.angle.degree(
                                cornerstoneMath.point.subtract(data.handles.middle, data.handles.start),
                                cornerstoneMath.point.subtract(data.handles.end, data.handles.middle)
                            );
                            return `${Math.abs(angle).toFixed(1)}°`;
                        }
                        return '';
                    }
                })
            },
            {
                key: 'Elliptical',
                internalKey: 'EllipticalRoi',
                label: 'ROI Ellipse',
                icon: 'fas fa-circle',
                tooltip: 'ROI Ellipse - Vùng quan tâm hình elip',
                className: 'EllipticalRoiTool',
                configFactory: () => ({
                    getTextCallback: function(data) {
                        if (data.handles && data.handles.start && data.handles.end) {
                            const width = Math.abs(data.handles.end.x - data.handles.start.x);
                            const height = Math.abs(data.handles.end.y - data.handles.start.y);
                            const area = Math.PI * (width / 2) * (height / 2);
                            return `Area: ${area.toFixed(1)} px²`;
                        }
                        return '';
                    }
                })
            },
            {
                key: 'Rectangle',
                internalKey: 'RectangleRoi',
                label: 'ROI Hình chữ nhật',
                icon: 'fas fa-square',
                tooltip: 'ROI Hình chữ nhật - Vùng quan tâm hình chữ nhật',
                className: 'RectangleRoiTool',
                configFactory: () => ({
                    getTextCallback: function(data) {
                        if (data.handles && data.handles.start && data.handles.end) {
                            const width = Math.abs(data.handles.end.x - data.handles.start.x);
                            const height = Math.abs(data.handles.end.y - data.handles.start.y);
                            const area = width * height;
                            return `Area: ${area.toFixed(1)} px²`;
                        }
                        return '';
                    }
                })
            },
            {
                key: 'Probe',
                internalKey: 'Probe',
                label: 'Probe',
                icon: 'fas fa-crosshairs',
                tooltip: 'Probe - Xem giá trị pixel tại điểm click',
                className: 'ProbeTool',
                configFactory: () => ({
                    getTextCallback: function(data) {
                        if (data.currentPoints && data.currentPoints.image) {
                            const imageData = data.currentPoints.image;
                            return `Value: ${imageData.intensity}`;
                        }
                        return '';
                    }
                })
            }
        ];

        function ensureToolDefinitions() {
            if (TOOL_DEFINITIONS.length === TOOL_METADATA.length) {
                return TOOL_DEFINITIONS;
            }
            if (typeof cornerstoneTools === 'undefined') {
                return [];
            }
            TOOL_DEFINITIONS = TOOL_METADATA.map(meta => {
                const toolClass = cornerstoneTools[meta.className];
                if (!toolClass) {
                    console.warn(`Tool class ${meta.className} not found in cornerstoneTools.`);
                    return null;
                }
                const config = meta.configFactory ? meta.configFactory() : (meta.config ? { ...meta.config } : {});
                return {
                    ...meta,
                    toolClass,
                    config
                };
            }).filter(Boolean);
            return TOOL_DEFINITIONS;
        }

        function buildToolbar() {
            const toolbar = document.querySelector('.viewer-toolbar');
            if (!toolbar) return;

            toolbar.innerHTML = '';

            const defs = ensureToolDefinitions();
            const uiDefs = defs.length > 0 ? defs : TOOL_METADATA;

            uiDefs.forEach(({ key, label, icon, tooltip }) => {
                const button = document.createElement('button');
                button.className = 'toolbar-btn';
                if (tooltip) button.title = tooltip;
                button.innerHTML = `<i class="${icon}"></i> ${label}`;
                button.addEventListener('click', () => setActiveTool(key, button));
                toolbar.appendChild(button);
            });

            const clearButton = document.createElement('button');
            clearButton.className = 'toolbar-btn';
            clearButton.title = 'Xóa - Xóa tất cả các đo đạc (Phím C hoặc Delete)';
            clearButton.innerHTML = '<i class="fas fa-trash"></i> Xóa';
            clearButton.addEventListener('click', () => {
                clearAnnotations();
                document.querySelectorAll('.viewer-toolbar .toolbar-btn').forEach(btn => btn.classList.remove('active'));
            });
            toolbar.appendChild(clearButton);
        }

        // Check if all libraries are loaded
        function checkLibrariesLoaded() {
            return typeof cornerstone !== 'undefined' &&
                   typeof dicomParser !== 'undefined' &&
                   typeof cornerstoneWADOImageLoader !== 'undefined' &&
                   typeof cornerstoneMath !== 'undefined' &&
                   typeof cornerstoneTools !== 'undefined';
        }

        // Wait for libraries to load
        function waitForLibraries(callback, maxAttempts = 100) {
            let attempts = 0;
            const checkInterval = setInterval(() => {
                attempts++;
                if (checkLibrariesLoaded()) {
                    clearInterval(checkInterval);
                    console.log('All libraries verified loaded');
                    callback();
                } else if (attempts >= maxAttempts) {
                    clearInterval(checkInterval);
                    console.error('Libraries failed to load after', maxAttempts, 'attempts');
                    console.error('Loaded libraries:', {
                        cornerstone: typeof cornerstone !== 'undefined',
                        dicomParser: typeof dicomParser !== 'undefined',
                        cornerstoneWADOImageLoader: typeof cornerstoneWADOImageLoader !== 'undefined',
                        cornerstoneMath: typeof cornerstoneMath !== 'undefined',
                        cornerstoneTools: typeof cornerstoneTools !== 'undefined'
                    });
                    
                    // Show more helpful error message
                    const missingLibs = [];
                    if (typeof cornerstone === 'undefined') missingLibs.push('cornerstone-core');
                    if (typeof dicomParser === 'undefined') missingLibs.push('dicom-parser');
                    if (typeof cornerstoneWADOImageLoader === 'undefined') missingLibs.push('cornerstone-wado-image-loader');
                    if (typeof cornerstoneMath === 'undefined') missingLibs.push('cornerstone-math');
                    if (typeof cornerstoneTools === 'undefined') missingLibs.push('cornerstone-tools');
                    
                    alert('Không thể tải các thư viện DICOM viewer:\n' + missingLibs.join(', ') + '\n\nVui lòng kiểm tra kết nối internet và tải lại trang.');
                }
            }, 100);
        }

        // Callback when libraries are ready
        window.onLibrariesReady = function() {
            console.log('Libraries ready callback called');
            // Wait a bit more to ensure everything is ready
            setTimeout(() => {
                if (checkLibrariesLoaded()) {
                    initializeCornerstone();
                } else {
                    waitForLibraries(() => {
                        initializeCornerstone();
                    });
                }
            }, 100);
        };

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            buildToolbar();
            loadPatients();
            const openOrthancBtn = document.getElementById('openOrthancBtn');
            if (openOrthancBtn) {
                openOrthancBtn.addEventListener('click', function() {

                    window.open(currentOrthancStudyUrl, '_blank');
                });

            // Libraries will be loaded by the script loader above
            // If they're already loaded, initialize immediately
            if (checkLibrariesLoaded()) {
                console.log('Libraries already loaded, initializing immediately');
                initializeCornerstone();
            } else {
                // Wait for libraries to load
                waitForLibraries(() => {

        // Initialize Cornerstone for DICOM viewing
        function initializeCornerstone() {
            if (!checkLibrariesLoaded()) {
                console.error('Libraries not loaded yet');
                return false;
            }
            
            try {
                cornerstoneWADOImageLoader.external.cornerstone = cornerstone;
                cornerstoneWADOImageLoader.external.dicomParser = dicomParser;
                cornerstoneTools.external.cornerstone = cornerstone;
                cornerstoneTools.external.cornerstoneMath = cornerstoneMath;
                // cornerstone-tools cần Hammer để support pointer/touch events
                if (typeof window.Hammer === 'undefined') {
                    throw new Error('Hammer.js is not loaded (window.Hammer is undefined)');
                }
                cornerstoneTools.external.Hammer = window.Hammer;

                if (!isWadoWorkerInitialized) {
                    const workerCandidates = [
                        {
                            workerPath: window.location.origin + `${VENDOR_BASE}/cornerstoneWADOImageLoaderWebWorker.js`,
                            codecsPath: window.location.origin + `${VENDOR_BASE}/cornerstoneWADOImageLoaderCodecs.js`,
                            label: 'local'
                        },
                        {
                            workerPath: 'https://unpkg.com/cornerstone-wado-image-loader@4.13.2/dist/cornerstoneWADOImageLoaderWebWorker.js',
                            codecsPath: 'https://unpkg.com/cornerstone-wado-image-loader@4.13.2/dist/cornerstoneWADOImageLoaderCodecs.js',
                            label: 'cdn'
                        }
                    ];
                    let lastWorkerError = null;
                    for (const candidate of workerCandidates) {
                        try {
                            cornerstoneWADOImageLoader.webWorkerManager.initialize({
                                // Giảm số worker để giảm overhead khởi tạo trên máy yếu.
                                maxWebWorkers: 1,
                                startWebWorkersOnDemand: true,
                                webWorkerPath: candidate.workerPath,
                                taskConfiguration: {
                                    decodeTask: {
                                        codecsPath: candidate.codecsPath
                                    }
                                }
                            });
                            isWadoWorkerInitialized = true;
                            console.log(`Cornerstone WADO web worker initialized (${candidate.label} assets).`);
                            break;
                        } catch (e) {
                            lastWorkerError = e;
                            console.warn(`Failed to initialize web worker (${candidate.label}).`, e);
                        }
                    }
                    if (!isWadoWorkerInitialized) {
                        alert('Không thể khởi tạo web worker DICOM (local + CDN). Hệ thống sẽ thử giải mã không dùng worker.');
                        try {
                            cornerstoneWADOImageLoader.configure({ useWebWorkers: false });
                        } catch (cfgErr) {
                            console.warn('Cannot disable web workers explicitly:', cfgErr);
                        }
                        if (lastWorkerError) {
                            console.warn('Last worker init error:', lastWorkerError);
                        }
                    }
                } else {
                    console.log('Cornerstone WADO web worker already initialized, skipping re-init.');
                }
                
                console.log('Cornerstone initialized successfully');
                return true;
            } catch (error) {
                console.error('Error initializing Cornerstone:', error);
                return false;
            }
        }

        async function refreshAutofillBadges() {
            const badges = Array.from(document.querySelectorAll('.autofill-badge[data-patient-name][data-filename]'));
            await Promise.all(badges.map(async (badge) => {
                const patientName = badge.getAttribute('data-patient-name') || '';
                const filename = badge.getAttribute('data-filename') || '';
                if (!filename) return;
                try {
                    const qs = new URLSearchParams({
                        patient_name: patientName,
                        filename: filename
                    });
                    const resp = await fetch(`/api/pacs/autofill-status?${qs.toString()}`);
                    const data = await resp.json();
                    const status = data && data.success ? (data.status || 'not_found') : 'not_found';
                    const label = data && data.success ? (data.label || 'Chưa autofill') : 'Chưa autofill';
                    badge.classList.remove('status-autofilled', 'status-failed', 'status-received', 'status-not_found');
                    badge.classList.add(`status-${status}`);
                    badge.textContent = label;
                    badge.classList.remove('clickable');
                    badge.removeAttribute('title');
                    if (status === 'autofilled' && data.ultrasound_result_id) {
                        badge.classList.add('clickable');
                        badge.setAttribute('data-result-id', String(data.ultrasound_result_id));
                        badge.setAttribute('title', 'Mở phiếu kết quả đã tự điền');
                    } else {
                        badge.removeAttribute('data-result-id');
                    }
                } catch (e) {
                    badge.classList.remove('status-autofilled', 'status-failed', 'status-received', 'status-not_found');
                    badge.classList.add('status-not_found');
                    badge.textContent = 'Chưa autofill';
                    badge.classList.remove('clickable');
                    badge.removeAttribute('data-result-id');
                }
            }));
        }

        async function refreshOrthancBadges() {
            const badges = Array.from(document.querySelectorAll('.orthanc-badge[data-patient-name][data-filename]'));
            await Promise.all(badges.map(async (badge) => {
                const patientName = badge.getAttribute('data-patient-name') || '';
                const filename = badge.getAttribute('data-filename') || '';
                if (!filename) return;
                try {
                    const url = `/api/vr-pacs/orthanc-link/${encodeURIComponent(patientName)}/${encodeURIComponent(filename)}`;
                    const resp = await fetch(url);
                    const data = await resp.json();
                    const linked = !!(resp.ok && data && data.success && data.orthanc_study_url);
                    badge.classList.remove('linked', 'unlinked');
                    badge.classList.add(linked ? 'linked' : 'unlinked');
                    badge.textContent = linked ? 'Orthanc: linked' : 'Orthanc: chưa linked';
                } catch (e) {
                    badge.classList.remove('linked');
                    badge.classList.add('unlinked');
                    badge.textContent = 'Orthanc: chưa linked';

        // Filter patients
        function filterPatients() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const sortBy = document.getElementById('sortSelect').value;

            filteredPatients = patientsData.filter(patient => 
                patient.name.toLowerCase().includes(searchTerm)

        function withTimeout(promise, timeoutMs, timeoutMessage) {
            return Promise.race([
                promise,
                new Promise((_, reject) => {
                    setTimeout(() => reject(new Error(timeoutMessage || 'DICOM load timeout')), timeoutMs);
                })
            ]);
        }

        async function loadDicomImageWithFallback(primaryImageId, dicomUrl) {
            // Cornerstone/WADO load có thể treo khi worker/codec gặp vấn đề.
            // Giảm timeout để UI không bị kẹt lâu.
            const loadTimeoutMs = 12000;
            try {
                return await withTimeout(
                    cornerstone.loadAndCacheImage(primaryImageId),
                    loadTimeoutMs,
                    'Tải ảnh quá lâu (timeout).'
                );
            } catch (primaryError) {
                console.warn('Primary wadouri load failed, switching to blob fallback:', primaryError);

                // Thử decode không dùng worker ngay khi primary fail/timeout.
                // Tránh trường hợp worker đã khởi tạo nhưng codec không load được.
                try {
                    cornerstoneWADOImageLoader.configure({ useWebWorkers: false });
                } catch (e) {
                    // ignore
                }

                const fallbackResp = await fetch(dicomUrl, { cache: 'no-store' });
                if (!fallbackResp.ok) {
                    let details = '';
                    try {
                        details = (await fallbackResp.text()).slice(0, 300);
                    } catch (_) {}
                    throw new Error(`Không tải được file DICOM (${fallbackResp.status}). ${details}`.trim());
                }

                const dicomBlob = await fallbackResp.blob();
                if (!cornerstoneWADOImageLoader?.wadouri?.fileManager) {
                    throw primaryError;
                }

                const blobImageId = cornerstoneWADOImageLoader.wadouri.fileManager.add(dicomBlob);
                try {
                    return await withTimeout(
                        cornerstone.loadAndCacheImage(blobImageId),
                        loadTimeoutMs,
                        'Fallback tải ảnh cũng bị timeout.'
                    );
                } catch (blobError) {
                    // Final attempt: disable web workers and decode in main thread.
                    // Some machines/browser policies block worker codecs unexpectedly.
                    try {
                        cornerstoneWADOImageLoader.configure({ useWebWorkers: false });
                    } catch (e) {
                        // ignore
                    }
                    return await withTimeout(
                        cornerstone.loadAndCacheImage(blobImageId),
                        loadTimeoutMs,
                        'Không thể giải mã ảnh DICOM.'
                    );
                }
            }
        }

        // View single DICOM image
        async function viewDicom(patientName, filename) {
            // Check if libraries are loaded
            if (!checkLibrariesLoaded()) {
                console.error('Cornerstone libraries not loaded');
                alert('Các thư viện DICOM viewer chưa được tải. Vui lòng đợi và thử lại.');
                return;
            }
            
            document.getElementById('modalPatientName').textContent = patientName;
            document.getElementById('modalFileName').textContent = filename;
            document.getElementById('viewerModal').style.display = 'block';
            setupOrthancOpenButton(patientName, filename);
            
            viewerElement = document.getElementById('dicomViewport');
            // Toolbar đã được build khi trang load; chỉ cần reset active states khi mở ảnh.
            document.querySelectorAll('.viewer-toolbar .toolbar-btn').forEach(btn => btn.classList.remove('active'));
            
            // Disable and clear previous content if exists
            try {
                if (typeof cornerstone !== 'undefined' && cornerstone.getEnabledElement) {
                    const enabledElement = cornerstone.getEnabledElement(viewerElement);
                    if (enabledElement) {
                        cornerstone.disable(viewerElement);
                    }
                }
            } catch (e) {
                console.log('No previous enabled element');
            }
            
            // Clear HTML content
            viewerElement.innerHTML = '';
            
            // Ensure Cornerstone is initialized
            if (!isViewerInitialized) {
                if (!initializeCornerstone()) {
                    alert('Không thể khởi tạo DICOM viewer. Vui lòng tải lại trang.');
                    return;
                }
            }
            
            // Enable cornerstone on the element
            try {
                if (typeof cornerstone !== 'undefined' && cornerstone.enable) {
                    cornerstone.enable(viewerElement);
                    console.log('✓ Cornerstone enabled on element');
                    
                    // Verify element is enabled
                    const enabledEl = cornerstone.getEnabledElement(viewerElement);
                    if (enabledEl) {
                        console.log('✓ Element verified as enabled');
                    } else {
                        console.warn('⚠ Element enabled but not found in enabled elements');
                    }
                } else {
                    throw new Error('Cornerstone not available');
                }
            } catch (e) {
                console.error('Error enabling cornerstone:', e);
                alert('Lỗi khi khởi tạo viewer: ' + e.message);
                return;
            }
            
            // Initialize tools - always ensure they're ready
            if (typeof cornerstoneTools !== 'undefined') {
                try {
                    if (!isViewerInitialized) {
                        try {
                            cornerstoneTools.init();
                            console.log('Cornerstone tools initialized');
                        } catch (e) {
                            console.log('Tools already initialized:', e.message);
                        }

                    const toolDefs = ensureToolDefinitions();
                    if (!toolDefs.length) {
                        console.warn('Tool definitions unavailable; skipping global registration for now.');
                    }

                    const uniqueDefs = Array.from(new Map((toolDefs.length > 0 ? toolDefs : []).map(def => [def.internalKey, def])).values());
            uniqueDefs.forEach(({ internalKey, toolClass, config, label }) => {
                            try {
                                cornerstoneTools.removeTool(internalKey);
                            } catch (e) {
                                // ignore
                            }

                            try {
                            cornerstoneTools.addTool(toolClass, {
                                name: internalKey,
                                configuration: config || {}
                            });
                                console.log(`✓ ${label || internalKey} tool registered globally`);
                            } catch (e) {
                                console.warn(`Could not add global tool ${internalKey}:`, e.message);
                            }
                        });

                        isViewerInitialized = true;
                    }

                    // For every view call ensure element has tools registered
                    const elementToolDefs = ensureToolDefinitions();
                    const uniqueElementDefs = Array.from(new Map(elementToolDefs.map(def => [def.internalKey, def])).values());
                    if (viewerElement && uniqueElementDefs.length > 0) {
                        const enabledEl = cornerstone.getEnabledElement(viewerElement);
                        if (enabledEl && cornerstoneTools.store) {
                            const storeElements = cornerstoneTools.store.state.enabledElements || [];
                            const inStore = storeElements.some(el => el.element === viewerElement);
                            if (!inStore) {
                                storeElements.push(enabledEl);
                                cornerstoneTools.store.state.enabledElements = storeElements;
                                console.log('✓ Element registered in store during tool setup');
                            }

                            uniqueElementDefs.forEach(({ internalKey, toolClass, config, label }) => {
                                try {
                                    cornerstoneTools.addToolForElement(viewerElement, toolClass, {
                                        name: internalKey,
                                        configuration: config || {}
                                    });
                                    console.log(`✓ Tool ${label || internalKey} registered for element`);
                                } catch (e) {
                                    console.warn(`⚠ Could not add tool ${internalKey} for element:`, e.message);
                                }
                            });
                        }
                    }
                } catch (e) {
                    console.error('Error initializing tools:', e);
                }
            }
            
            // Ensure element is registered in cornerstone tools store
            try {
                if (typeof cornerstoneTools !== 'undefined' && cornerstoneTools.store) {
                    // The element should be automatically registered when cornerstone.enable is called
                    console.log('Cornerstone tools store available');
                    
                    // Make sure element is properly registered
                    const enabledElement = cornerstone.getEnabledElement(viewerElement);
                    if (enabledElement) {
                        console.log('Element enabled, should be registered in store');
                    }
                }
            } catch (e) {
                console.log('Could not access cornerstone tools store:', e);
            }

            // Load image
            const dicomUrl = `${window.location.origin}/api/vr-pacs/dicom/${encodeURIComponent(patientName)}/${encodeURIComponent(filename)}`;
            const imageId = `wadouri:${dicomUrl}`;
            currentImageId = imageId;

            try {
                console.log('Loading DICOM image:', imageId);
                
                // Show loading indicator (create overlay instead of replacing content)
                const viewport = document.getElementById('dicomViewport');
                let loadingDiv = document.getElementById('loading-overlay');
                if (!loadingDiv) {
                    loadingDiv = document.createElement('div');
                    loadingDiv.id = 'loading-overlay';
                    loadingDiv.style.cssText = 'position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); color: white; text-align: center; padding-top: 50%; z-index: 1000;';

            if (typeof cornerstoneTools === 'undefined' || typeof cornerstone === 'undefined') {

            if (!viewerElement) {

            try {
                if (currentImageId && cornerstoneTools.globalImageIdSpecificToolStateManager) {
                    const toolState = cornerstoneTools.globalImageIdSpecificToolStateManager.toolState;
                    
                    // Clear all tool states for current image
                    if (toolState[currentImageId]) {
                        delete toolState[currentImageId];
                    }
                    
                    // Also try to clear all measurements
                    const enabledElement = cornerstone.getEnabledElement(viewerElement);
                    if (enabledElement) {
                        const toolStateManager = cornerstoneTools.globalImageIdSpecificToolStateManager;
                        const imageId = enabledElement.image.imageId;
                        
                        // Clear measurements for all tools
                        const toolsToClear = ['Length', 'DistanceLength', 'Angle', 'EllipticalRoi', 'RectangleRoi', 'Probe'];
                        toolsToClear.forEach(toolName => {
                            try {
                                const state = toolStateManager.saveToolState(imageId, toolName);
                                if (state && state.data) {
                                    state.data = [];
                                    toolStateManager.restoreToolState(imageId, toolName, state);
                                }
                            } catch (e) {
                                // Tool state might not exist
                            }
                        });
                    }
                }
                
                // Update image to reflect changes
                if (typeof cornerstone.updateImage === 'function') {
                    cornerstone.updateImage(viewerElement);

                console.log('Annotations cleared');

                try {
                    if (currentImageId) {
                        const toolState = cornerstoneTools.globalImageIdSpecificToolStateManager.toolState;
                        if (toolState[currentImageId]) {
                            delete toolState[currentImageId];
                            cornerstone.updateImage(viewerElement);

                }

        function maybeAutoImportFromAnnotations() {
            try {
                if (!viewerElement || !currentImageId) return;
                if (AUTO_IMPORT_DONE_FOR_IMAGE_ID === currentImageId) return;

                const pixelSpacing = getPixelSpacingMmFromViewer();
                if (!pixelSpacing) return;

                const toolStateManager = cornerstoneTools && cornerstoneTools.globalImageIdSpecificToolStateManager;
                const toolState = toolStateManager && toolStateManager.toolState ? toolStateManager.toolState : null;
                const stateForImage = toolState && toolState[currentImageId] ? toolState[currentImageId] : {};

                const allLengthsMm = extractAllLengthsMm(stateForImage, pixelSpacing).sort((a, b) => b - a);
                let fl = null;
                let bpd = null;
                if (allLengthsMm.length >= 2) {
                    fl = allLengthsMm[0];      // longest
                    bpd = allLengthsMm[1];     // second longest
                } else if (allLengthsMm.length === 1) {
                    bpd = allLengthsMm[0];
                }

                const allEllipseCircMm = extractRoiCircumferenceMm(stateForImage, 'EllipticalRoi', pixelSpacing);
                const hc = allEllipseCircMm.length ? Math.max(...allEllipseCircMm) : null;
                const allRectCircMm = extractRoiCircumferenceMm(stateForImage, 'RectangleRoi', pixelSpacing);
                const ac = allRectCircMm.length ? Math.max(...allRectCircMm) : null;

                // Only redirect when we have đủ BPD/HC/AC/FL.
                // This prevents auto-navigation after the user has only drawn one tool.
                const hasAll = (bpd != null && hc != null && ac != null && fl != null);
                if (!hasAll) {
                    return;
                }

                AUTO_IMPORT_DONE_FOR_IMAGE_ID = currentImageId;
                importAnnotationsToUltrasoundAnalysisAuto({ bpd, hc, ac, fl }).catch(err => {
                    console.error('Auto import failed:', err);
                    AUTO_IMPORT_DONE_FOR_IMAGE_ID = null;
                });
            } catch (e) {
                console.warn('maybeAutoImportFromAnnotations error:', e);
            }
        }

        function stripDiacritics(str) {
            try {
                return (str || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
            } catch (e) {
                return (str || '').toLowerCase().trim();
            }
        }

        function getPixelSpacingMmFromViewer() {
            try {
                if (!viewerElement || typeof cornerstone === 'undefined') return null;
                const enabled = cornerstone.getEnabledElement(viewerElement);
                const image = enabled && enabled.image ? enabled.image : null;
                if (!image) return null;
                const row = image.rowPixelSpacing;
                const col = image.columnPixelSpacing;
                const rowVal = Array.isArray(row) ? row[0] : row;
                const colVal = Array.isArray(col) ? col[0] : col;
                const r = parseFloat(rowVal);
                const c = parseFloat(colVal);
                if (!isFinite(r) || !isFinite(c)) return null;
                return (r + c) / 2;
            } catch (e) {
                return null;
            }
        }

        function getToolEntriesForImage(stateForImage, toolKey) {
            const t = stateForImage ? stateForImage[toolKey] : null;
            if (!t) return [];
            if (Array.isArray(t)) return t;
            if (Array.isArray(t.data)) return t.data;
            // Some tool states can be wrapped; fallback
            if (t.data && Array.isArray(t.data.data)) return t.data.data;
            return [];
        }

        function extractLatestLengthMm(stateForImage, pixelSpacing) {
            if (!pixelSpacing || pixelSpacing <= 0) return null;
            const entries = [
                ...getToolEntriesForImage(stateForImage, 'Length'),
                ...getToolEntriesForImage(stateForImage, 'DistanceLength'),
            ];
            if (!entries.length) return null;

            // Take the longest (likely FL/BPD in a single tool workflow)
            let best = null;
            entries.forEach(entry => {
                const handles = entry && entry.handles ? entry.handles : null;
                const start = handles && handles.start ? handles.start : null;
                const end = handles && handles.end ? handles.end : null;
                if (!start || !end) return;
                const distPx = cornerstoneMath.point.distance(start, end);
                const distMm = distPx * pixelSpacing;
                if (!best || distMm > best.distMm) best = { distMm };
            });
            return best ? best.distMm : null;
        }

        function extractAllLengthsMm(stateForImage, pixelSpacing) {
            if (!pixelSpacing || pixelSpacing <= 0) return [];
            const entries = [
                ...getToolEntriesForImage(stateForImage, 'Length'),
                ...getToolEntriesForImage(stateForImage, 'DistanceLength'),
            ];
            const values = [];
            entries.forEach(entry => {
                const handles = entry && entry.handles ? entry.handles : null;
                const start = handles && handles.start ? handles.start : null;
                const end = handles && handles.end ? handles.end : null;
                if (!start || !end) return;
                const distPx = cornerstoneMath.point.distance(start, end);
                const distMm = distPx * pixelSpacing;
                if (isFinite(distMm)) values.push(distMm);
            });
            return values;
        }

        function ellipseCircumferenceRamanujan(a, b) {
            // Ramanujan approximation for ellipse perimeter
            return Math.PI * (3 * (a + b) - Math.sqrt((3 * a + b) * (a + 3 * b)));
        }

        function extractRoiCircumferenceMm(stateForImage, toolKey, pixelSpacing) {
            if (!pixelSpacing || pixelSpacing <= 0) return [];
            const entries = getToolEntriesForImage(stateForImage, toolKey);
            const values = [];
            entries.forEach(entry => {
                const handles = entry && entry.handles ? entry.handles : null;
                const start = handles && handles.start ? handles.start : null;
                const end = handles && handles.end ? handles.end : null;
                if (!start || !end) return;

                const widthPx = Math.abs(end.x - start.x);
                const heightPx = Math.abs(end.y - start.y);
                const aMm = (widthPx * pixelSpacing) / 2;
                const bMm = (heightPx * pixelSpacing) / 2;
                if (!isFinite(aMm) || !isFinite(bMm)) return;

                const c = ellipseCircumferenceRamanujan(aMm, bMm);
                if (isFinite(c) && c > 0) values.push(c);
            });
            return values;
        }

        async function importAnnotationsToUltrasoundAnalysisAuto(prefilledMetrics) {
            try {
                if (typeof cornerstoneTools === 'undefined' || typeof cornerstone === 'undefined' || typeof cornerstoneMath === 'undefined') {
                    alert('Cornerstone chưa sẵn sàng. Vui lòng tải lại trang.');
                    return;
                }
                if (!viewerElement || !currentImageId) {
                    alert('Chưa có ảnh DICOM đang mở để lấy đo đạc.');
                    return;
                }

                const pixelSpacing = getPixelSpacingMmFromViewer();
                if (!pixelSpacing && !prefilledMetrics) {
                    alert('Không lấy được pixel spacing từ ảnh DICOM, không thể quy đổi sang mm để suy ra BPD/HC/AC/FL.');
                    return;
                }

                const toolStateManager = cornerstoneTools.globalImageIdSpecificToolStateManager;
                const toolState = toolStateManager && toolStateManager.toolState ? toolStateManager.toolState : null;
                const stateForImage = toolState && toolState[currentImageId] ? toolState[currentImageId] : {};

                let fl = prefilledMetrics && prefilledMetrics.fl != null ? prefilledMetrics.fl : null;
                let bpd = prefilledMetrics && prefilledMetrics.bpd != null ? prefilledMetrics.bpd : null;

                // ROI ellipse/rectangle -> HC/AC (circumference approximation)
                let hc = prefilledMetrics && prefilledMetrics.hc != null ? prefilledMetrics.hc : null;
                let ac = prefilledMetrics && prefilledMetrics.ac != null ? prefilledMetrics.ac : null;

                if (!hc || !ac) {
                    // Only compute ROI-derived metrics if not prefilled
                    const safePixelSpacing = pixelSpacing || getPixelSpacingMmFromViewer();
                    if (safePixelSpacing && (!hc || !ac)) {
                        const allEllipseCircMm = extractRoiCircumferenceMm(stateForImage, 'EllipticalRoi', safePixelSpacing);
                        hc = hc || (allEllipseCircMm.length ? Math.max(...allEllipseCircMm) : null);
                        const allRectCircMm = extractRoiCircumferenceMm(stateForImage, 'RectangleRoi', safePixelSpacing);
                        ac = ac || (allRectCircMm.length ? Math.max(...allRectCircMm) : null);
                    }
                }

                if (!fl || !bpd) {
                    const safePixelSpacing = pixelSpacing || getPixelSpacingMmFromViewer();
                    if (safePixelSpacing) {
                        const allLengthsMm = extractAllLengthsMm(stateForImage, safePixelSpacing).sort((a, b) => b - a);
                        if (allLengthsMm.length >= 2) {
                            fl = fl || allLengthsMm[0];
                            bpd = bpd || allLengthsMm[1];
                        } else if (allLengthsMm.length === 1) {
                            bpd = bpd || allLengthsMm[0];
                        }
                    }
                }

                if (!bpd && !hc && !ac && !fl) {
                    alert('Chưa phát hiện đo đạc phù hợp (Length/EllipticalRoi/RectangleRoi) trong ảnh hiện tại.');
                    return;
                }

                const missing = [];
                if (!bpd) missing.push('BPD (Length tool)');
                if (!hc) missing.push('HC (ROI Ellipse)');
                if (!ac) missing.push('AC (ROI Hình chữ nhật)');
                if (!fl) missing.push('FL (Length tool)');
                // Only hard-block if nothing at all; otherwise continue and let backend decide scoring
                if (missing.length >= 3) {
                    alert('Thiếu dữ liệu đo để suy ra đầy đủ: ' + missing.join(', ') + '. Hệ thống vẫn sẽ tạo khuyến nghị dựa trên đo hiện có.');
                }

                // Try resolve patient_id by DICOM PatientName
                const patientNameFromModal = document.getElementById('modalPatientName') ? document.getElementById('modalPatientName').textContent : '';
                let patient_id = null;
                try {
                    const res = await fetch('/api/patients');
                    if (res.ok) {
                        const list = await res.json();
                        const match = Array.isArray(list) ? list.find(p => stripDiacritics(p.name) === stripDiacritics(patientNameFromModal)) : null;
                        patient_id = match && match.id ? match.id : null;
                    }
                } catch (e) {
                    // OK: vẫn có thể import để user chọn patient sau
                }

                const analysisRes = await fetch('/api/analyze-ultrasound-measurements', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        patient_id: patient_id,
                        bpd: bpd,
                        hc: hc,
                        ac: ac,
                        fl: fl
                    })
                });

                if (!analysisRes.ok) {
                    const txt = await analysisRes.text();
                    alert('Không phân tích được đo từ annotation. ' + (txt || analysisRes.statusText));
                    return;
                }

                const analysis = await analysisRes.json();

                const payload = {
                    patient_id: patient_id,
                    bpd: analysis.bpd,
                    hc: analysis.hc,
                    ac: analysis.ac,
                    fl: analysis.fl,
                    analysis: analysis
                };

                localStorage.setItem(ULTRASOUND_ANNOT_IMPORT_KEY, JSON.stringify(payload));
                window.location.href = '/ultrasound-analysis.html';
            } catch (e) {
                console.error('importAnnotationsToUltrasoundAnalysisAuto error:', e);
                alert('Lỗi khi import đo tự động: ' + (e && e.message ? e.message : String(e)));
            }
        }

        function closeViewer() {
            document.getElementById('viewerModal').style.display = 'none';
            currentOrthancStudyUrl = '';
            const btn = document.getElementById('openOrthancBtn');
            if (btn) {
                btn.style.display = 'none';
                btn.disabled = true;
                btn.title = '';
            }
            if (viewerElement && typeof cornerstone !== 'undefined') {
                try {
                    if (typeof cornerstone.disable === 'function') {
                        cornerstone.disable(viewerElement);
                    }
                } catch (e) {
                    console.error('Error disabling cornerstone:', e);
                }
                
                // Remove element from cornerstoneTools store to avoid operating on disabled elements
                try {
                    if (cornerstoneTools.store && Array.isArray(cornerstoneTools.store.state.enabledElements)) {
                        cornerstoneTools.store.state.enabledElements = cornerstoneTools.store.state.enabledElements.filter(
                            el => el.element !== viewerElement
                        );
                    }
                } catch (e) {
                    console.warn('Error removing element from cornerstoneTools store:', e);
                }
                
                viewerElement = null;
                currentImageId = null;
            }
        }

        // Refresh data
        function refreshData() {
            loadPatients();
        }

        // Setup keyboard shortcuts
        function setupKeyboardShortcuts() {
            document.addEventListener('keydown', function(e) {
                const modal = document.getElementById('viewerModal');
                if (modal && modal.style.display === 'block') {
                    // Only handle shortcuts when modal is open
                    
                    // Tool shortcuts (number keys 1-9)
                    if (e.key >= '1' && e.key <= '9' && !e.ctrlKey && !e.altKey && !e.shiftKey) {
                        const toolIndex = parseInt(e.key) - 1;
                        const buttons = document.querySelectorAll('.viewer-toolbar .toolbar-btn');
                        if (buttons[toolIndex] && !buttons[toolIndex].textContent.includes('Xóa')) {
                            buttons[toolIndex].click();
                            e.preventDefault();
                        }
                    }
                    
                    // ESC to close modal
                    if (e.key === 'Escape') {
                        closeViewer();
                        e.preventDefault();
                    }
                    
                    // Delete/Backspace to clear annotations
                    if ((e.key === 'Delete' || e.key === 'Backspace') && !e.ctrlKey) {
                        clearAnnotations();
                        e.preventDefault();
                    }
                    
                    // C for clear
                    if (e.key === 'c' || e.key === 'C') {
                        clearAnnotations();
                        e.preventDefault();
                    }
                    
                    // W for Window/Level
                    if (e.key === 'w' || e.key === 'W') {
                        const btn = document.querySelector('.viewer-toolbar .toolbar-btn');
                        if (btn) btn.click();
                        e.preventDefault();
                    }
                    
                    // P for Pan
                    if (e.key === 'p' || e.key === 'P') {
                        const btn = Array.from(document.querySelectorAll('.viewer-toolbar .toolbar-btn')).find(b => b.textContent.includes('Pan'));
                        if (btn) btn.click();
                        e.preventDefault();
                    }
                    
                    // Z for Zoom
                    if (e.key === 'z' || e.key === 'Z') {
                        const btn = Array.from(document.querySelectorAll('.viewer-toolbar .toolbar-btn')).find(b => b.textContent.includes('Zoom'));
                        if (btn) btn.click();
                        e.preventDefault();
                    }
                }
            });
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('viewerModal');
            if (event.target === modal) {
                closeViewer();
            }
        }
        
        // Initialize keyboard shortcuts on page load
        setupKeyboardShortcuts();
    </script>
